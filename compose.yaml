name: nacos

services:
  nacos:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    platform: linux/arm64
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NACOS_AUTH_TOKEN_SECRET_FILE: /run/secrets/nacos/auth-token-secret
      NACOS_DATABASE_HOST: host.docker.internal
      NACOS_DATABASE_NAME: nacos
      NACOS_DATABASE_PASSWORD_FILE: /run/secrets/nacos/database-password
      NACOS_DATABASE_PORT: "5400"
      NACOS_DATABASE_USER: nacos
      NACOS_JAVA_XMS: 512m
      NACOS_JAVA_XMX: 1024m
      NACOS_SERVER_IDENTITY_KEY_FILE: /run/secrets/nacos/server-identity-key
      NACOS_SERVER_IDENTITY_VALUE_FILE: /run/secrets/nacos/server-identity-value
      TZ: Asia/Shanghai
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8081:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - type: bind
        source: ${NACOS_SECRETS_DIR:-/Users/yuanzhan/Documents/Data/nacos/secrets}
        target: /run/secrets/nacos
        read_only: true
      - type: bind
        source: ${NACOS_DATA_DIR:-/Users/yuanzhan/Documents/Data/nacos/data}
        target: /home/nacos/data
      - type: bind
        source: ${NACOS_LOGS_DIR:-/Users/yuanzhan/Documents/Data/nacos/logs}
        target: /home/nacos/logs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/v3/console/health/readiness
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
